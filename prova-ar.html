<!DOCTYPE html><html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prova AR — Shapeless</title>
<script type="module" src="js/model-viewer.min.js"></script>
<style>
 body{font-family:system-ui,sans-serif;margin:0;padding:20px;background:#faf9f7;color:#1a1a1a}
 h1{font-size:19px;margin:0 0 6px} p.intro{font-size:14px;color:#666;margin:0 0 26px;line-height:1.6}
 .test{background:#fff;border:1px solid #e2ddd5;border-radius:4px;padding:16px;margin-bottom:22px}
 .test h2{font-size:15px;margin:0 0 4px} .test small{color:#777;font-size:12px;display:block;margin-bottom:12px}
 model-viewer{width:100%;height:260px;background:#f2efe9;display:block;border-radius:3px}
 button{width:100%;margin-top:12px;padding:14px;font-size:15px;border:0;border-radius:3px;
        background:#6b1f45;color:#fff;font-weight:600}
 button[disabled]{background:#bbb}
 .esito{margin-top:10px;font-size:13px;color:#666;min-height:18px}
</style></head><body>
<h1>Prova realtà aumentata</h1>
<p class="intro">Due volte lo stesso vaso bordeaux, salvato in due modi diversi.
Apri la realtà aumentata di ognuno e dimmi <strong>di che colore arriva</strong>.</p>

<div class="test">
  <h2>A — file separati (.gltf + .bin)</h2>
  <small>è quello che usa il sito adesso</small>
  <model-viewer id="a" src="models-web/blade-6b1f45.gltf" camera-controls
    ar ar-modes="scene-viewer webxr quick-look" ar-scale="fixed" ar-placement="floor"
    shadow-intensity="0.4" environment-image="neutral"></model-viewer>
  <button id="ba" disabled>Apri A in realtà aumentata</button>
  <div class="esito" id="ea"></div>
</div>

<div class="test">
  <h2>B — file unico (.glb)</h2>
  <small>colore incorporato, nessun file esterno</small>
  <model-viewer id="b" src="models-web/prova-bordeaux.glb" camera-controls
    ar ar-modes="scene-viewer webxr quick-look" ar-scale="fixed" ar-placement="floor"
    shadow-intensity="0.4" environment-image="neutral"></model-viewer>
  <button id="bb" disabled>Apri B in realtà aumentata</button>
  <div class="esito" id="eb"></div>
</div>

<script>
[['a','ba','ea'],['b','bb','eb']].forEach(function(t){
  var mv=document.getElementById(t[0]), bt=document.getElementById(t[1]), es=document.getElementById(t[2]);
  mv.addEventListener('load',function(){
    if(mv.canActivateAR){ bt.disabled=false; }
    else { es.textContent='Realtà aumentata non disponibile su questo dispositivo.'; }
  });
  bt.addEventListener('click',function(){ mv.activateAR(); });
  mv.addEventListener('ar-status',function(e){ es.textContent='stato: '+e.detail.status; });
});
</script></body></html>
